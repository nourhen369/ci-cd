- name: Déployer Docker image sur la VM Azure
  hosts: web
  become: yes

  tasks:
    - name: Update APT cache
      apt:
        update_cache: yes

    - name: Installer les dépendances Docker
      apt:
        name: [ "apt-transport-https", "ca-certificates", "curl", "software-properties-common" ]
        state: present

    - name: Installer Docker
      apt:
        name: docker.io
        state: present

    - name: Ensure Docker enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Déployer le conteneur
      docker_container:
        name: myapp
        image: myapp:latest
        state: started
        restart_policy: always
        published_ports:
          - "80:80"